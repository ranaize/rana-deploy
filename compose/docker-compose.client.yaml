# rana-deploy — CLIENT (notebook) stack.
# The rana-voice-agent runs in docker; the notebook-side rana-socketd daemon (the
# "socket") is run NATIVELY on the host by `make client` (see rana-deploy/Makefile).
# The host daemon listens on the unix socket at run/rana/rana-local.sock (a host dir
# bind-mounted here at /run/rana) that the agent forwards audio to. Running the
# daemon on the host lets it actually reach host resources (xdg-open, lights, etc.).
#
# Bring up with:  make client   (from rana-deploy/)

services:
  rana-voice-agent:
    build:
      context: ../../rana-voice-agent
      dockerfile: images/runtime.Dockerfile
    container_name: rana-voice-agent
    user: "1000:1000"
    group_add:
      - "984"
    # Reach the remote STT/LLM tower (server stack) at host.docker.internal:9000.
    # The server stack's host daemon listens on :9000 on the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host PulseAudio socket for mic capture (read-only).
      - /run/user/1000:/run/user/1000:ro
      # Trained wake-word + openWakeWord resources (sibling repo). The oww
      # resources mount is read-only and must target the venv site-packages
      # (openwakeword is installed into /app/.venv since the image builds
      # sudoless — the old /usr/local/... system-path mount no longer exists).
      - ../../rana-voice-models/models:/app/models
      - ../../rana-voice-models/.oww-models:/app/.venv/lib/python3.11/site-packages/openwakeword/resources/models:ro
      # Shared UDS with the host-side notebook daemon (run/rana on the host).
      - ../run/rana:/run/rana
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - XDG_RUNTIME_DIR=/run/user/1000
    restart: unless-stopped
