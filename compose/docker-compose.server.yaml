# rana-deploy — SERVER (tower) stack.
# LocalAI runs in docker; the rana-socketd daemon (the "socket") is run NATIVELY
# on the host by `make server` (see rana-deploy/Makefile). The daemon binds TCP
# :9000 on the host and reaches LocalAI via the host-published 8080 below. This
# keeps LocalAI off the host network except for the published port the daemon uses.
#
# Builds the rana-socketd image (sibling ../../rana-socket) only to extract the
# static daemon + hop scripts into /usr/local/bin — the daemon itself is NOT run
# here. Bring up with:  make server   (from rana-deploy/)

services:
  localai:
    image: localai/localai:latest-cpu
    container_name: localai_server
    # Published so the HOST daemon (rana-socketd) can reach it at http://127.0.0.1:8080.
    # The daemon is the only LocalAI caller (the `ask`/`stt` hops), so the surface
    # is just this port on localhost.
    ports:
      - "8080:8080"
    environment:
      - GALLS=true
      - DEFAULT_MODEL_TIMEOUT=30m
      - THREADS=4
      - MODELS_PATH=/build/models
    volumes:
      - ../../rana-voice-backend/config:/build/models:cached
      - ../../rana-voice-backend/models:/build/models/bins:cached
    command: ["run"]
    restart: unless-stopped
